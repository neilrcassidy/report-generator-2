[project]
name = "report-generator"
version = "0.1.0"
description = "Local web app for recording mock exams and generating report card PDFs."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.14",
    "fastapi[standard]>=0.115",
    "jinja2>=3.1",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "reportlab>=5.1.1",
    "sqlmodel>=0.0.22",
]

[project.scripts]
report-generator = "report_generator.__main__:main"

[dependency-groups]
dev = [
    "pypdf>=7.1.1",
    "pyright>=1.1.390",
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/report_generator"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# FastAPI's dependency injection idiom triggers B008.
"src/report_generator/web/**" = ["B008"]
# Generated by alembic (blank "Revises: " header on the first revision).
"src/report_generator/db/migrations/versions/**" = ["W291"]

[tool.pyright]
include = ["src", "tests"]
# Alembic-generated revisions use sqlmodel.sql types that pyright cannot resolve.
exclude = ["src/report_generator/db/migrations/versions"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
